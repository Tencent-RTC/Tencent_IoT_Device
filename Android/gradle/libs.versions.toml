[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.5.0"
junit = "4.13.2"
junitVersion = "1.1.3"
espressoCore = "3.4.0"
appcompat = "1.3.1"
material = "1.4.0"
constraintlayout = "2.1.4"
recyclerview = "1.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
